<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쇼츠수술대 — 30초 원고 진단</title>
  <style>
    :root{--ink:#171717;--muted:#6f6f78;--line:#e7e4df;--paper:#fffdf9;--accent:#ff5c35;--soft:#fff0e9}
    *{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    main{max-width:880px;margin:0 auto;padding:48px 18px 72px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:13px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:26px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.02;letter-spacing:-.06em;margin:10px 0}.hero p{color:var(--muted);margin:0;line-height:1.65}.badge{background:var(--ink);color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;white-space:nowrap}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 30px #29200d0b}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}label{font-size:13px;font-weight:700;color:var(--muted)}select,textarea,button{font:inherit}select,textarea{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;color:var(--ink)}textarea{min-height:220px;resize:vertical;line-height:1.65}button{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}button:hover{filter:brightness(.95)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.hint{font-size:12px;color:var(--muted)}#result{display:none;margin-top:18px}.score{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}.score strong{font-size:48px;letter-spacing:-.06em}.meter{height:9px;background:#eee7de;border-radius:99px;flex:1;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.stats b,.stats span{display:block}.stats span{color:var(--muted);font-size:12px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.finding{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.finding b{display:block;margin-bottom:6px}.finding span{color:var(--muted);font-size:13px;line-height:1.55}.output{margin-top:16px;background:var(--soft);border-radius:14px;padding:16px;line-height:1.7;white-space:pre-wrap}.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}@media(max-width:620px){main{padding-top:30px}.hero{display:block}.badge{display:inline-block;margin-top:14px}.controls,.grid,.stats{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}}
  </style>
</head>
<body>
<main>
  <section class="hero"><div><div class="eyebrow">SHORTS SURGERY / 001</div><h1>쇼츠수술대</h1><p>게시 전에 원고의 약한 부분을 30초 안에 찾아보세요.<br>원고는 서버에 저장되지 않습니다.</p></div><div class="badge">무료 베타</div></section>
  <section class="card">
    <div class="controls"><label>콘텐츠 분야<select id="field"><option>정보·교육</option><option>상품·리뷰</option><option>브이로그·일상</option><option>재미·스토리</option></select></label><label>목표<select id="goal"><option>조회수 늘리기</option><option>팔로우 받기</option><option>구매·문의 만들기</option></select></label></div>
    <label>쇼츠 원고<textarea id="script" placeholder="예: 오늘은 집에서 커피를 맛있게 만드는 방법을 알려드릴게요..."></textarea></label>
    <div class="actions"><span class="hint">최소 2문장, 40자 이상이면 더 정확해요.</span><button id="run">원고 수술하기</button></div>
  </section>
  <section id="result" class="card" aria-live="polite"></section>
  <section class="card" style="margin-top:18px;background:#171717;color:#fff;border:0"><b style="color:#ffb09b">혼자 고치기 어렵다면</b><h2 style="margin:8px 0 6px;font-size:24px">원고 10개를 직접 수술해 드립니다.</h2><p style="color:#c9c5bf;line-height:1.6;margin:0">첫 3초 오프닝 2안과 목표에 맞는 마무리 문구까지 48시간 이내에 전달합니다.<br>베타 가격 9,900원 · 성과 보장 없음</p></section>
  <div class="footer">쇼츠수술대는 창작 보조 도구이며, 성과를 보장하지 않습니다.</div>
</main>
<script>
const $=s=>document.querySelector(s);
function analyze(){
  const text=$('#script').value.trim(), field=$('#field').value, goal=$('#goal').value;
  if(text.length<40){alert('원고를 40자 이상 입력해 주세요.');return}
  const sentences=text.split(/[.!?。！？\n]+/).map(x=>x.trim()).filter(Boolean), first=sentences[0]||'';
  const chars=[...text].length, words=text.split(/\s+/).filter(Boolean).length, seconds=Math.max(1,Math.round(words/2.5)), hasNumber=/\d|첫째|둘째|3가지|세 가지|한 가지/.test(text), hasQuestion=/[?？]|왜|어떻게|알고 있/.test(first), hasBenefit=/얻|바뀌|줄|늘|쉽|비법|방법|추천|해결|전후|차이|결과/.test(text), hasAction=/댓글|저장|팔로우|구독|링크|확인|신청|구매|DM|눌러/.test(text), hasSpecific=field==='상품·리뷰'?/가격|원|링크|장점|단점|비교|사용/.test(text):/오늘|지금|직접|실제|초|분|일|대상|사람/.test(text);
  const hookType=hasQuestion?'질문형':/충격|비밀|절대|모르면|실수|진짜/.test(first)?'손해·반전형':hasNumber?'숫자형':'설명 시작형';
  const checks=[['훅 유형',hookType!=='설명 시작형',`현재 ${hookType}입니다. 첫 문장을 질문·손해·결과 중 하나로 더 선명하게 만드세요.`],['구체성',hasNumber||hasSpecific,'숫자, 시간, 대상, 전후 결과 중 하나를 넣으세요.'],['시청자 보상',hasBenefit,'시청자가 끝까지 봐야 얻는 결과를 앞부분에 약속하세요.'],['행동 유도',hasAction,goal==='조회수 늘리기'?'저장·공유 중 하나만 요청해 보세요.':goal==='팔로우 받기'?'다음 편에서 얻을 것을 말하고 팔로우를 요청하세요.':'댓글·DM·링크 중 하나만 명확히 요청하세요.']];
  const score=Math.round(checks.filter(x=>x[1]).length/4*100), hook=hasQuestion?first:`${field}에서 대부분 놓치는 ${hasNumber?'핵심 '+(text.match(/\d+/)?.[0]||'3')+'가지':'한 가지'}를 지금 보여드릴게요.`;
  const ending=goal==='조회수 늘리기'?'도움이 됐다면 저장해 두고, 필요한 사람에게 공유해 주세요.':goal==='팔로우 받기'?'다음 편에서 바로 따라 할 수 있게 보여드릴게요. 팔로우해 두세요.':'체크리스트가 필요하면 댓글에 “체크”라고 남겨 주세요.';
  const role=sentences.map((s,i)=>`${i+1}. ${i===0?'훅·문제 제시':i===sentences.length-1?'마무리·행동 유도':'근거·해결 과정'} — ${s.slice(0,42)}${s.length>42?'…':''}`).join('\n');
  const report=`쇼츠수술대 진단 결과\n점수 ${score}/100 · 예상 ${seconds}초 · ${chars}자 · ${hookType}\n\n문장 역할\n${role}\n\n추천 오프닝\n${hook}\n\n추천 마무리\n${ending}`;
  $('#result').style.display='block';$('#result').innerHTML=`<div class="score"><strong>${score}<small>%</small></strong><div class="meter"><i style="width:${score}%"></i></div><b>${score>=75?'게시 준비 완료':score>=50?'한 번 더 다듬기':'훅부터 수술 필요'}</b></div><div class="stats"><div><b>${seconds}초</b><span>예상 러닝타임</span></div><div><b>${chars}자</b><span>원고 길이</span></div><div><b>${hookType}</b><span>훅 유형</span></div></div><div class="grid">${checks.map(x=>`<div class="finding"><b>${x[1]?'✅':'⚠️'} ${x[0]}</b><span>${x[1]?'현재 원고에 들어 있습니다.':x[2]}</span></div>`).join('')}</div><div class="output"><b>문장별 역할</b>\n${role}\n\n<b>추천 오프닝</b>\n${hook}\n\n<b>추천 마무리</b>\n${ending}<br><button id="copy" style="margin-top:14px;background:#171717">진단 결과 복사</button></div>`;
  $('#copy').addEventListener('click',async()=>{await navigator.clipboard.writeText(report);$('#copy').textContent='복사 완료';});
  $('#result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('#run').addEventListener('click',analyze);
</script>
</body>
</html>
